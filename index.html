<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B0C0F">
<title>Trustera Challenge</title>
<style>
:root{--bg:#0B0C0F;--card:#121419;--gold:#F5B83D;--green:#3DDBB4;--red:#FF5D5D;--sand:#F6F3EA;--muted:#A8ADB5;--line:#292D35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--sand);font-family:"Segoe UI",Tahoma,Arial,sans-serif}
button,input{font:inherit}.wrap{max-width:900px;margin:auto;padding:24px 18px 56px}.brand{display:flex;align-items:center;gap:14px}.mark{width:62px;height:62px}.brand h1{margin:0;font-size:30px}.brand p{margin:4px 0 0;color:var(--muted)}
.lang{margin-inline-start:auto;display:flex;gap:8px}.lang button{background:transparent;color:var(--sand);border:1px solid #444b55;border-radius:10px;padding:9px 12px;cursor:pointer}.lang .active{border-color:var(--gold);color:var(--gold)}
.hero{padding:42px 0 18px}.hero h2{font-size:clamp(38px,8vw,64px);line-height:1.06;margin:10px 0 16px}.hero p{font-size:18px;line-height:1.7;color:#c5c8ce}
.kicker{color:var(--gold);font-weight:800;font-size:12px}.card{margin-top:20px;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:16px}.hidden{display:none!important}
.namebox{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:22px}.namebox input{min-height:48px;background:#0E1014;color:var(--sand);border:1px solid #3A3F49;border-radius:12px;padding:0 14px}
.primary,.secondary{border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;min-height:46px}.primary{background:var(--gold);color:#17181C;border:0}.secondary{background:transparent;color:var(--sand);border:1px solid #404550}
.top{display:flex;justify-content:space-between;gap:14px;align-items:center}.timer{color:var(--gold);font-weight:800}.progress{height:7px;background:#20242B;border-radius:99px;overflow:hidden;margin-top:14px}.progress span{display:block;height:100%;background:var(--gold);width:0}
.q{font-size:30px;font-weight:800;margin:24px 0 8px}.sub{color:#b8bcc3;line-height:1.6}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.field{padding:16px;text-align:inherit;background:#0E1014;color:var(--sand);border:1px solid #353A44;border-radius:14px;cursor:pointer;min-height:82px}.field strong{display:block;font-family:ui-monospace,monospace}.field small{display:block;color:#9DA2AA;margin-top:6px}.field.selected{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}.feedback{margin-top:18px;padding:16px;border-radius:12px;background:#0E1014;border:1px solid #343944}.green{color:var(--green)}.red{color:var(--red)}
.scoreline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}.chip{padding:8px 12px;border:1px solid #343944;border-radius:999px;background:#0E1014}
.passport{margin-top:22px;padding:20px;border-radius:16px;background:#0D1514;border:1px solid var(--green)}.status{font-size:38px;font-weight:900}.metric{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid #2A2F35}
.footer{margin-top:34px;padding-top:18px;border-top:1px solid #242830;color:#898F98;font-size:12px}
@media(max-width:640px){.brand{align-items:flex-start}.lang{flex-direction:column}.fields,.namebox{grid-template-columns:1fr}.q{font-size:25px}}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">
<svg class="mark" viewBox="0 0 64 64" aria-label="Trustera mark">
<rect x="1" y="1" width="62" height="62" rx="16" fill="#121419"/>
<path d="M12 18 C20 18 21 29 29 29" stroke="#F5B83D" stroke-width="5" fill="none" stroke-linecap="round"/>
<circle cx="12" cy="18" r="5" fill="#F5B83D"/>
<path d="M12 46 C20 46 21 35 29 35" stroke="#FF5D5D" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="2 8"/>
<circle cx="12" cy="46" r="5" fill="#FF5D5D"/>
<rect x="27" y="24" width="18" height="18" rx="6" fill="#F5B83D"/>
<path d="M45 33 H55" stroke="#3DDBB4" stroke-width="5" stroke-linecap="round"/>
<circle cx="56" cy="33" r="5" fill="#3DDBB4"/>
</svg>
<div><h1>Trustera</h1><p id="tagline"></p></div>
<div class="lang"><button id="arBtn" class="active">العربية</button><button id="enBtn">English</button></div>
</div>

<section id="intro" class="hero">
<div id="introKicker" class="kicker"></div>
<h2 id="introTitle"></h2>
<p id="introText"></p>
<div class="namebox"><input id="playerName" maxlength="24"><button id="start" class="primary"></button></div>
</section>

<section id="game" class="card hidden">
<div class="top"><div><div id="roundLabel"></div><div id="scenarioLabel" class="kicker"></div></div><div id="timer" class="timer">00:20</div></div>
<div class="progress"><span id="bar"></span></div>
<div id="question" class="q"></div>
<div id="context" class="sub"></div>
<div id="fields" class="fields"></div>
<div class="actions"><button id="submit" class="primary"></button></div>
<div id="feedback" class="feedback hidden"></div>
<div class="scoreline"><div class="chip"><span id="scoreLabel"></span>: <strong id="score">0</strong></div><div class="chip"><span id="correctLabel"></span>: <strong id="correctCount">0</strong>/3</div></div>
</section>

<section id="final" class="card hidden">
<div id="finalKicker" class="kicker"></div>
<div id="finalTitle" class="q green"></div>
<div id="finalSummary" class="sub"></div>
<div class="passport">
<div id="passportLabel" class="kicker"></div><div class="status green">VERIFIED</div>
<div class="metric"><span id="nameMetric"></span><strong id="finalName"></strong></div>
<div class="metric"><span id="scoreMetric"></span><strong id="finalScore" class="green"></strong></div>
<div class="metric"><span id="correctMetric"></span><strong id="finalCorrect"></strong></div>
</div>
<div class="actions"><button id="again" class="secondary"></button></div>
</section>

<div id="footer" class="footer"></div>
</main>

<script>
(()=>{
const copy={
ar:{
dir:"rtl",tag:"صلاحيات واضحة. أدلة قابلة للتتبع. لكل ربط.",introK:"3 جولات · تحدي سريع",title:"من يحق له الوصول للبيانات؟",
intro:"اختر أقل قدر من البيانات التي يحتاجها كل طرف ثالث. كل إجابة صحيحة تعطيك نقاط، والسرعة تضيف نقاطًا إضافية.",
name:"اكتب اسمك",start:"ابدأ التحدي",round:"الجولة",of:"من",submit:"تأكيد الإجابة",score:"النقاط",correct:"الإجابات الصحيحة",
ok:"إجابة صحيحة ✓",ok2:"اخترت فقط البيانات الضرورية.",bad:"ليست الإجابة المثالية.",wrong:"اخترت بيانات غير مطلوبة: ",missing:"ونسيت بيانات مطلوبة: ",
done:"انتهى التحدي",perfect:"ممتاز! طبّقت مبدأ أقل صلاحية بنجاح.",normal:"الآن تعرف الفرق بين الحاجة والصلاحية.",
summary:"Trustera تتحقق من أن الطرف الثالث يحصل فقط على البيانات المصرح بها، وتكشف أي فرق بين السياسة والسلوك الفعلي.",
passport:"جواز ثقة التكامل",nameM:"اسم اللاعب",scoreM:"النتيجة",correctM:"الجولات الصحيحة",again:"العب مرة أخرى",
footer:"Trustera · SAIF 2026 · سيناريوهات تجريبية للتوعية فقط",
rounds:[
{t:"شريك التوصيل",q:"ما البيانات التي يحتاجها شريك التوصيل؟",c:"يحتاج فقط لإيصال الطلب المخصص له وتحديث حالته.",o:[["order_id","رقم الطلب",1],["delivery_address","عنوان التوصيل",1],["delivery_status","حالة التوصيل",1],["customer_phone","رقم جوال العميل",0],["national_id","الهوية الوطنية",0],["private_record","سجل خاص",0]]},
{t:"بوابة الدفع",q:"ما البيانات التي تحتاجها بوابة الدفع؟",c:"تحتاج تنفيذ عملية الدفع وربطها بالطلب، وليس الاطلاع على بيانات شخصية إضافية.",o:[["order_id","رقم الطلب",1],["payment_amount","قيمة العملية",1],["payment_status","حالة الدفع",1],["delivery_address","عنوان التوصيل",0],["national_id","الهوية الوطنية",0],["medical_record","سجل طبي",0]]},
{t:"خدمة التحليلات",q:"ما البيانات المناسبة لخدمة التحليلات؟",c:"الهدف قياس الأداء العام بدون إرسال بيانات تعريف شخصية مباشرة.",o:[["anonymous_event_id","معرّف حدث مجهول",1],["page_view","مشاهدة الصفحة",1],["device_type","نوع الجهاز",1],["customer_name","اسم العميل",0],["customer_phone","رقم الجوال",0],["national_id","الهوية الوطنية",0]]}
]},
en:{
dir:"ltr",tag:"Clear permissions. Traceable evidence. Every integration.",introK:"3 rounds · quick challenge",title:"Who gets the data?",
intro:"Choose the minimum data each third party truly needs. Correct answers earn points, and speed adds a bonus.",
name:"Enter your name",start:"Start challenge",round:"Round",of:"of",submit:"Submit answer",score:"Score",correct:"Correct rounds",
ok:"Correct ✓",ok2:"You selected only the necessary data.",bad:"Not quite.",wrong:"You selected unnecessary data: ",missing:"You missed required data: ",
done:"Challenge complete",perfect:"Excellent! You applied least privilege correctly.",normal:"Now you know the difference between need and permission.",
summary:"Trustera verifies that a third party receives only authorized data and exposes any gap between policy and actual behavior.",
passport:"Integration Passport",nameM:"Player",scoreM:"Score",correctM:"Correct rounds",again:"Play again",
footer:"Trustera · SAIF 2026 · Synthetic awareness scenarios only",
rounds:[
{t:"Delivery partner",q:"What data should the delivery partner access?",c:"It only needs enough information to deliver the assigned order and update its status.",o:[["order_id","Order ID",1],["delivery_address","Delivery address",1],["delivery_status","Delivery status",1],["customer_phone","Customer phone",0],["national_id","National ID",0],["private_record","Private record",0]]},
{t:"Payment gateway",q:"What data does the payment gateway need?",c:"It needs to process payment and link it to the order, not access unrelated personal data.",o:[["order_id","Order ID",1],["payment_amount","Payment amount",1],["payment_status","Payment status",1],["delivery_address","Delivery address",0],["national_id","National ID",0],["medical_record","Medical record",0]]},
{t:"Analytics service",q:"What data is appropriate for analytics?",c:"The goal is to measure overall performance without sending direct personal identifiers.",o:[["anonymous_event_id","Anonymous event ID",1],["page_view","Page view",1],["device_type","Device type",1],["customer_name","Customer name",0],["customer_phone","Customer phone",0],["national_id","National ID",0]]}
]}}
let lang="ar";const state={name:"",round:0,score:0,correct:0,selected:new Set(),sec:30,t:null};const $=id=>document.getElementById(id);
function show(id){["intro","game","final"].forEach(x=>$(x).classList.toggle("hidden",x!==id));window.scrollTo({top:0,behavior:"smooth"})}
function applyLang(l){lang=l;const c=copy[l];document.documentElement.lang=l;document.documentElement.dir=c.dir;$("arBtn").classList.toggle("active",l==="ar");$("enBtn").classList.toggle("active",l==="en");$("tagline").textContent=c.tag;$("introKicker").textContent=c.introK;$("introTitle").textContent=c.title;$("introText").textContent=c.intro;$("playerName").placeholder=c.name;$("start").textContent=c.start;$("submit").textContent=c.submit;$("scoreLabel").textContent=c.score;$("correctLabel").textContent=c.correct;$("finalKicker").textContent=c.done;$("passportLabel").textContent=c.passport;$("nameMetric").textContent=c.nameM;$("scoreMetric").textContent=c.scoreM;$("correctMetric").textContent=c.correctM;$("again").textContent=c.again;$("footer").textContent=c.footer;if(!$("game").classList.contains("hidden"))renderRound()}
function start(){const n=$("playerName").value.trim();if(!n){$("playerName").focus();return}state.name=n;state.round=0;state.score=0;state.correct=0;renderRound();show("game")}
function renderRound(){clearInterval(state.t);state.selected.clear();state.sec=30;const c=copy[lang],r=c.rounds[state.round];$("roundLabel").textContent=c.round+" "+(state.round+1)+" "+c.of+" 3";$("scenarioLabel").textContent=r.t;$("question").textContent=r.q;$("context").textContent=r.c;$("score").textContent=state.score;$("correctCount").textContent=state.correct;$("feedback").classList.add("hidden");$("submit").disabled=false;$("timer").textContent="00:30";$("bar").style.width="0%";$("fields").innerHTML="";r.o.forEach(([k,label])=>{const b=document.createElement("button");b.type="button";b.className="field";b.innerHTML="<strong>"+k+"</strong><small>"+label+"</small>";b.addEventListener("click",()=>{state.selected.has(k)?state.selected.delete(k):state.selected.add(k);b.classList.toggle("selected")});$("fields").appendChild(b)});state.t=setInterval(()=>{state.sec--;$("timer").textContent="00:"+String(state.sec).padStart(2,"0");$("bar").style.width=((30-state.sec)/30*100)+"%";if(state.sec<=0){clearInterval(state.t);submitRound()}},1000)}
function submitRound(){if($("submit").disabled)return;clearInterval(state.t);$("submit").disabled=true;const c=copy[lang],r=c.rounds[state.round],correctSet=new Set(r.o.filter(x=>x[2]===1).map(x=>x[0])),chosen=state.selected;const ok=chosen.size===correctSet.size&&[...correctSet].every(x=>chosen.has(x));const wrong=[...chosen].filter(x=>!correctSet.has(x)),missing=[...correctSet].filter(x=>!chosen.has(x));if(ok){const pts=100+state.sec*3;state.correct++;state.score+=pts;$("feedback").innerHTML="<strong class='green'>"+c.ok+"</strong><div class='sub'>+"+pts+" — "+c.ok2+"</div>"}else{$("feedback").innerHTML="<strong class='red'>"+c.bad+"</strong><div class='sub'>"+(wrong.length?c.wrong+wrong.join(", ")+" ":"")+(missing.length?c.missing+missing.join(", "):"")+"</div>"}$("feedback").classList.remove("hidden");$("score").textContent=state.score;$("correctCount").textContent=state.correct;setTimeout(()=>{state.round++;state.round<3?renderRound():finish()},1400)}
function finish(){const c=copy[lang];$("finalName").textContent=state.name;$("finalScore").textContent=state.score;$("finalCorrect").textContent=state.correct+" / 3";$("finalTitle").textContent=state.correct===3?c.perfect:c.normal;$("finalSummary").textContent=c.summary;show("final")}
$("arBtn").addEventListener("click",()=>applyLang("ar"));$("enBtn").addEventListener("click",()=>applyLang("en"));$("start").addEventListener("click",start);$("submit").addEventListener("click",submitRound);$("again").addEventListener("click",()=>show("intro"));applyLang("ar");
})();
</script>
</body>
</html>
